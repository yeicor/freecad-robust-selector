<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#1b4f72"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecf0f1"/>
    </linearGradient>
  </defs>
  <!-- Selection box frame with corner handles -->
  <rect x="7" y="7" width="50" height="50" rx="6" fill="#f8fafc" stroke="#2c3e50" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Corner selection handles -->
  <rect x="4" y="4" width="7" height="7" rx="1.5" fill="#2c3e50"/>
  <rect x="53" y="4" width="7" height="7" rx="1.5" fill="#2c3e50"/>
  <rect x="4" y="53" width="7" height="7" rx="1.5" fill="#2c3e50"/>
  <rect x="53" y="53" width="7" height="7" rx="1.5" fill="#2c3e50"/>
  <!-- Central shield for robust semantic protection -->
  <path d="M32 15 C39 15 45 18 47 21 C47 36 39 45 32 49 C25 45 17 36 17 21 C19 18 25 15 32 15 Z" 
        fill="url(#shieldGrad)" stroke="#154360" stroke-width="2.5" stroke-linejoin="round"/>
