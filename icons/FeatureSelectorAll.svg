        fill="url(#shieldAll)" stroke="#935116" stroke-width="2" stroke-linejoin="round"/>
  <!-- Star or double checkmark inside badge -->
  <polygon points="42,32 44.5,37.5 50.5,38 46,42 47.5,48 42,44.8 36.5,48 38,42 33.5,38 39.5,37.5" fill="#ffffff"/>
